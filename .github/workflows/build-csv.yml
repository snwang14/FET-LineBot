name: Build CSV

on:
  push:
    paths:
      - 'logs/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install pandas openpyxl

      - name: Generate CSV
        run: |
          python scripts/build_csv.py

      - name: Generate Excel
        run: |
          python scripts/build_excel.py

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/line_message_log.csv
          git add reports/line_message_log.xlsx

          if ! git diff --cached --quiet; then
            git commit -m "Update LINE logs"
          fi

      - name: Push
        run: |
          git push
