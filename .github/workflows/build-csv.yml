name: Build CSV

concurrency:
  group: build-csv
  cancel-in-progress: true

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CSV
        run: |
          python scripts/build_csv.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull Latest
        run: |
          git pull origin main

      - name: Commit CSV
        run: |
          git add reports/line_message_log.csv

          if ! git diff --cached --quiet; then
            git commit -m "Update line_message_log.csv"
          fi

      - name: Push
        run: |
          git push origin main
